<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Diamond Icon (Combining Wealth + Data) -->
  <path d="M200 200L400 0L600 200L400 400L200 200Z" fill="url(#gradient)"/>
  <path d="M400 0L600 200L800 0L600 0L400 0Z" fill="#0F172A" fill-opacity="0.2"/>
  <path d="M600 200L800 0L1000 200L800 400L600 200Z" fill="url(#gradient)"/>
  
  <!-- Data Lines Inside Diamond -->
  <path d="M400 100L600 300L800 100" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M450 150L750 150" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/> <!-- Gold -->
      <stop offset="100%" stop-color="#B77900"/> <!-- Darker Gold -->
    </linearGradient>
  </defs>
  
  <!-- Logotype -->
  <text x="850" y="250" font-family="'Arial', sans-serif" font-weight="bold" font-size="80" fill="#0F172A">EMEX</text>
  <text x="850" y="300" font-family="'Arial', sans-serif" font-size="40" fill="#64748B">CAPITAL</text>
</svg>